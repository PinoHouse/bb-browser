<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bb-browser Status</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; max-width: 640px; color: #202124; }
    h1 { font-size: 20px; margin: 0 0 20px; }
    dl { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; margin: 0; }
    dt { color: #5f6368; }
    dd { margin: 0; overflow-wrap: anywhere; }
    #connected[data-state="connected"] { color: #137333; }
    #connected[data-state="disconnected"] { color: #b3261e; }
    button { margin-top: 20px; padding: 7px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>bb-browser Native Host</h1>
  <dl>
    <dt>Host Name</dt><dd id="host-name">com.pinix.bb_browser</dd>
    <dt>Extension ID</dt><dd id="extension-id">—</dd>
    <dt>Connection</dt><dd id="connected">Checking…</dd>
    <dt>Last Connected</dt><dd id="last-connected-at">—</dd>
    <dt>Last Error</dt><dd id="last-error">—</dd>
  </dl>
  <button id="refresh" type="button">Refresh</button>
  <script src="options.js"></script>
</body>
</html>
